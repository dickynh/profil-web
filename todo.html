<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List | Pena Informatika</title>
    <style>
        /* --- PENAINFORMATIKA DESIGN SYSTEM --- */
        :root {
            --bg-dark: #1a1a1a;
            --card-bg: #2a2a2a;
            --accent: #00d4ff;
            --text-main: #f0f0f0;
            --text-muted: #aaa;
            --danger: #ff6b6b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        h2 { text-align: center; margin-bottom: 25px; color: var(--accent); letter-spacing: -0.5px; }

        /* === INPUT AREA RESPONSIVE & EYE-CATCHING === */
        .input-group { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 25px; 
            width: 100%;
        }

        input[type="text"] {
            flex: 1; 
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            min-width: 0; /* Mencegah overflow di HP kecil */
        }

        input[type="text"]:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(0,212,255,0.15); 
        }

        .btn-add {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #1a1a1a;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            min-width: 110px; /* Lebar minimum agar proporsional */
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
        }

        .btn-add:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(0,212,255,0.4); 
        }

        /* === FILTER TABS === */
        .filters { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .filter-btn {
            background: transparent;
            border: 1px solid #444;
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .filter-btn.active { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: bold; }

        /* === TASK LIST === */
        ul { list-style: none; max-height: 400px; overflow-y: auto; }
        
        li {
            background: rgba(255,255,255,0.03);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.3s ease-out;
            border-left: 3px solid transparent;
            transition: all 0.3s;
        }

        li.completed { opacity: 0.6; border-left-color: var(--accent); }
        li.completed span.task-text { text-decoration: line-through; color: var(--text-muted); }

        .task-info { display: flex; flex-direction: column; gap: 4px; flex: 1; cursor: pointer; margin-right: 10px; }
        .task-text { font-size: 0.95rem; word-break: break-word; }
        .task-time { font-size: 0.7rem; color: #666; }

        .btn-delete {
            background: rgba(255, 107, 107, 0.1);
            border: none;
            color: var(--danger);
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            opacity: 0;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        li:hover .btn-delete { opacity: 1; background: rgba(255, 107, 107, 0.2); }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* SCROLLBAR CUSTOM */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        /* RESPONSIF HP */
        @media (max-width: 480px) {
            .app-container { padding: 20px; }
            .btn-add { min-width: 90px; padding: 14px 15px; font-size: 0.9rem; }
            .btn-delete { opacity: 1; padding: 8px; } /* Selalu tampil di HP */
            .filter-btn { padding: 6px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>📋 Manajemen Tugas Harian</h2>
    
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Apa rencana kerjamu hari ini?" autocomplete="off">
        <button class="btn-add" onclick="addTask()">Tambah</button>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all')">Semua</button>
        <button class="filter-btn" onclick="setFilter('active')">Aktif</button>
        <button class="filter-btn" onclick="setFilter('completed')">Selesai</button>
    </div>

    <ul id="taskList"></ul>
</div>

<script>
    // 1. STATE MANAGEMENT
    let tasks = JSON.parse(localStorage.getItem('penaTasks')) || [];
    let currentFilter = 'all';

    // 2. CORE FUNCTIONS
    function saveToLocal() {
        localStorage.setItem('penaTasks', JSON.stringify(tasks));
        renderTasks();
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        const text = input.value.trim();
        
        if (!text) return alert("Tugas tidak boleh kosong!");

        const newTask = {
            id: Date.now(),
            text: text,
            completed: false,
            createdAt: new Date().toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit' })
        };

        tasks.unshift(newTask);
        input.value = '';
        saveToLocal();
    }

    function toggleTask(id) {
        tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
        saveToLocal();
    }

    function deleteTask(id) {
        if(confirm("Yakin hapus tugas ini?")) {
            tasks = tasks.filter(t => t.id !== id);
            saveToLocal();
        }
    }

    // 3. RENDERING ENGINE
    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = '';

        const filteredTasks = tasks.filter(t => {
            if (currentFilter === 'active') return !t.completed;
            if (currentFilter === 'completed') return t.completed;
            return true;
        });

        if (filteredTasks.length === 0) {
            list.innerHTML = `<li style="justify-content:center; color:#666; border:none;">Belum ada tugas ${currentFilter === 'all' ? '' : currentFilter}</li>`;
            return;
        }

        filteredTasks.forEach(task => {
            const li = document.createElement('li');
            li.className = task.completed ? 'completed' : '';
            li.innerHTML = `
                <div class="task-info" onclick="toggleTask(${task.id})">
                    <span class="task-text">${escapeHtml(task.text)}</span>
                    <span class="task-time">⏰ ${task.createdAt}</span>
                </div>
                <button class="btn-delete" onclick="deleteTask(${task.id})">🗑️</button>
            `;
            list.appendChild(li);
        });
    }

    // SECURITY & UX HELPERS
    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // EVENT LISTENERS
    document.getElementById('taskInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addTask();
    });

    // INIT
    renderTasks();
</script>

</body>
</html>
